plugins {
    id 'com.android.application'
}

def resolveConfigValue = { String name, String defaultValue = "" ->
    def value = providers.gradleProperty(name)
            .orElse(providers.environmentVariable(name))
            .getOrElse(defaultValue)
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}



android {
    namespace 'com.ExProgs.telegrambot'
    compileSdk 33

    defaultConfig {
        applicationId "com.ExProgs.telegrambot"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "TELEGRAM_BOT_TOKEN", "\"${resolveConfigValue("TELEGRAM_BOT_TOKEN")}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.github.pengrad:java-telegram-bot-api:6.7.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
