name: Setup Android SDK
description: Скачивает cmdline-tools и ставит platform-tools, android-33 и build-tools 34
runs:
  using: composite
  steps:
    - name: Download and unpack cmdline-tools
      shell: bash
      run: |
        set -e
        ANDROID_HOME="$HOME/android-sdk"
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        {
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
        } >> "$GITHUB_ENV"
        {
          echo "$ANDROID_HOME/cmdline-tools/latest/bin"
          echo "$ANDROID_HOME/platform-tools"
        } >> "$GITHUB_PATH"

    - name: Install SDK packages
      shell: bash
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;34.0.0" > /dev/null
